name: Publish Gitee release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to repair
        required: true
        type: string
      repair_existing:
        description: Replace existing managed assets and updater feed
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: buff-sentinel-gitee-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.29.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: buff-sentinel-release
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test -- --maxWorkers=1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.29.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: buff-sentinel-release
      - run: pnpm install --frozen-lockfile
      - name: Build signed installer and updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD.' }
          pnpm tauri:build:release
      - uses: actions/upload-artifact@v5
        with:
          name: signed-windows-release
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
      - name: Use latest publishing script for manual repair
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- scripts/publish-gitee.ps1
      - uses: actions/download-artifact@v5
        with:
          name: signed-windows-release
          path: src-tauri/target/release/bundle/nsis
      - name: Publish and update feed
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          REPAIR_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_existing || false }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) { throw 'Missing GITEE_TOKEN.' }
          $arguments = @{ Version = $env:RELEASE_TAG; SkipBuild = $true }
          if ($env:REPAIR_EXISTING -eq 'true' -or '${{ github.run_attempt }}' -ne '1') { $arguments.RepairExisting = $true }
          ./scripts/publish-gitee.ps1 @arguments
