name: Publish Gitee release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to repair
        required: true
        type: string
      repair_existing:
        description: Replace managed assets and same-version updater feed
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitee-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build:
    name: Build signed Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed Windows installer and updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured.'
          }

          pnpm tauri:build:release

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: signed-windows-release
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and verify Gitee release
    needs:
      - validate
      - build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Use latest release script for a manual repair
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- scripts/publish-gitee.ps1

      - name: Download signed release artifacts
        uses: actions/download-artifact@v5
        with:
          name: signed-windows-release
          path: src-tauri/target/release/bundle/nsis

      - name: Publish release to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          REPAIR_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_existing || false }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) {
            throw 'GitHub Actions secret GITEE_TOKEN is not configured.'
          }

          $publishArgs = @{
            Version = $env:RELEASE_TAG
            SkipBuild = $true
          }
          if ([int]$env:RUN_ATTEMPT -gt 1 -or $env:REPAIR_EXISTING -eq 'true') {
            $publishArgs.RepairExisting = $true
          }

          ./scripts/publish-gitee.ps1 @publishArgs
